<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Unfract data architecture</title>
  <desc id="desc">A hierarchical flow diagram showing users and access grants leading to workspaces, projects, and operational modules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="workspace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1266d6"/>
      <stop offset="1" stop-color="#0b3e91"/>
    </linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d9a78"/>
      <stop offset="1" stop-color="#12634f"/>
    </linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202d42"/>
      <stop offset="1" stop-color="#182233"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6ca9ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58d8b0"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: .2px; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a7b4c7; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b8c4d6; }
      .moduleLabel { font: 650 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .moduleSmall { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9eafc5; }
      .eyebrow { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9ed0ff; letter-spacing: 1.5px; text-transform: uppercase; }
      .lineBlue { stroke: #6ca9ff; stroke-width: 2.5; fill: none; marker-end: url(#arrowBlue); }
      .lineGreen { stroke: #58d8b0; stroke-width: 2.5; fill: none; marker-end: url(#arrowGreen); }
      .hairline { stroke: #314158; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1320" cy="70" r="260" fill="#1266d6" opacity=".08"/>
  <circle cx="240" cy="900" r="330" fill="#1d9a78" opacity=".06"/>

  <text x="80" y="76" class="eyebrow">UNFRACT · DATA ARCHITECTURE</text>
  <text x="80" y="126" class="title">Dal workspace ai moduli operativi</text>
  <text x="80" y="160" class="subtitle">La gerarchia dei dati e il contesto che determina visibilità, permessi e sincronizzazione.</text>

  <!-- Access layer -->
  <g filter="url(#shadow)">
    <rect x="80" y="245" width="230" height="112" rx="18" fill="#182233" stroke="#52647e" stroke-width="1.5"/>
    <circle cx="116" cy="283" r="18" fill="#253958"/>
    <path d="M108 284c0-5 4-9 8-9s8 4 8 9M104 298c2-6 7-9 12-9s10 3 12 9" fill="none" stroke="#9ed0ff" stroke-width="2" stroke-linecap="round"/>
    <text x="150" y="284" class="label">Utenti</text>
    <text x="104" y="322" class="small">identità autenticata</text>
    <text x="104" y="342" class="small">email · Google · sessione</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="80" y="405" width="230" height="112" rx="18" fill="#182233" stroke="#52647e" stroke-width="1.5"/>
    <circle cx="116" cy="443" r="18" fill="#253958"/>
    <path d="M108 443h16M116 435v16M105 454h22" stroke="#9ed0ff" stroke-width="2" stroke-linecap="round"/>
    <text x="150" y="444" class="label">Access grants</text>
    <text x="104" y="482" class="small">workspace · project</text>
    <text x="104" y="502" class="small">utente · gruppo · ruolo</text>
  </g>

  <path d="M310 301 H390 V461 H470" class="lineBlue"/>
  <path d="M310 461 H390" class="lineBlue"/>
  <text x="326" y="286" class="small">autenticazione</text>
  <text x="326" y="446" class="small">autorizzazione</text>

  <!-- Workspace -->
  <g filter="url(#shadow)">
    <rect x="470" y="245" width="380" height="272" rx="24" fill="url(#workspace)" stroke="#6ca9ff" stroke-width="1.5"/>
    <text x="510" y="292" class="eyebrow">CONTAINER ORGANIZZATIVO</text>
    <text x="510" y="335" class="title" font-size="29">Workspace</text>
    <text x="510" y="370" class="small" fill="#d8e9ff">membri · team · ruoli · quote</text>
    <path d="M510 397 H810" class="hairline" stroke="#8fc1ff" opacity=".45"/>
    <text x="510" y="430" class="small">structureMode: flat / teams / corporate</text>
    <text x="510" y="458" class="small">storageUsed · aiCreditsUsed</text>
    <text x="510" y="486" class="small">WorkspaceQuotas</text>
  </g>

  <path d="M850 381 H930" class="lineGreen"/>
  <text x="866" y="365" class="small">contiene</text>

  <!-- Project -->
  <g filter="url(#shadow)">
    <rect x="930" y="245" width="360" height="272" rx="24" fill="url(#project)" stroke="#58d8b0" stroke-width="1.5"/>
    <text x="970" y="292" class="eyebrow" fill="#b0ffe7">CONTESTO OPERATIVO</text>
    <text x="970" y="335" class="title" font-size="29">Project</text>
    <text x="970" y="370" class="small">il filtro operativo principale</text>
    <path d="M970 397 H1250" class="hairline" stroke="#9debd2" opacity=".45"/>
    <text x="970" y="430" class="small">projectId · workspaceId</text>
    <text x="970" y="458" class="small">owner · creator · access</text>
    <text x="970" y="486" class="small">dati separati per progetto</text>
  </g>

  <!-- Downstream modules -->
  <path d="M1110 517 V590" class="lineGreen"/>
  <path d="M560 590 H1350" class="hairline" stroke="#58d8b0" opacity=".5"/>
  <path d="M560 590 V625" class="lineGreen"/>
  <path d="M760 590 V625" class="lineGreen"/>
  <path d="M960 590 V625" class="lineGreen"/>
  <path d="M1160 590 V625" class="lineGreen"/>
  <path d="M1360 590 V625" class="lineGreen"/>

  <g filter="url(#shadow)">
    <rect x="455" y="625" width="210" height="166" rx="18" fill="url(#module)" stroke="#3d526d"/>
    <circle cx="495" cy="671" r="18" fill="#24456b"/>
    <path d="M486 671h18M495 662v18" stroke="#9ed0ff" stroke-width="2" stroke-linecap="round"/>
    <text x="485" y="724" class="moduleLabel">Tasks</text>
    <text x="485" y="750" class="moduleSmall">columns · epics</text>
    <text x="485" y="772" class="moduleSmall">comments · files</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="675" y="625" width="210" height="166" rx="18" fill="url(#module)" stroke="#3d526d"/>
    <circle cx="715" cy="671" r="18" fill="#245b55"/>
    <path d="M706 664h18v14h-18zM710 660v5M720 660v5" fill="none" stroke="#9debd2" stroke-width="2" stroke-linecap="round"/>
    <text x="705" y="724" class="moduleLabel">CRM</text>
    <text x="705" y="750" class="moduleSmall">accounts · leads</text>
    <text x="705" y="772" class="moduleSmall">pipeline · follow-up</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="895" y="625" width="210" height="166" rx="18" fill="url(#module)" stroke="#3d526d"/>
    <circle cx="935" cy="671" r="18" fill="#514273"/>
    <path d="M927 663h16v18h-16zM931 659h8" fill="none" stroke="#ddc7ff" stroke-width="2" stroke-linecap="round"/>
    <text x="925" y="724" class="moduleLabel">Documentation</text>
    <text x="925" y="750" class="moduleSmall">editor · media</text>
    <text x="925" y="772" class="moduleSmall">history · references</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1115" y="625" width="210" height="166" rx="18" fill="url(#module)" stroke="#3d526d"/>
    <circle cx="1155" cy="671" r="18" fill="#6b4932"/>
    <path d="M1147 665h16v13h-16zM1151 660v6M1159 660v6M1150 682h10" fill="none" stroke="#ffd3a4" stroke-width="2" stroke-linecap="round"/>
    <text x="1145" y="724" class="moduleLabel">Meetings</text>
    <text x="1145" y="750" class="moduleSmall">audio · transcript</text>
    <text x="1145" y="772" class="moduleSmall">decisions · tasks</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1335" y="625" width="210" height="166" rx="18" fill="url(#module)" stroke="#3d526d"/>
    <circle cx="1375" cy="671" r="18" fill="#274f6b"/>
    <path d="M1367 664h16v13h-16zM1370 660h10" fill="none" stroke="#9ed0ff" stroke-width="2" stroke-linecap="round"/>
    <text x="1365" y="724" class="moduleLabel">Chat · AI Hub</text>
    <text x="1365" y="750" class="moduleSmall">channels · direct</text>
    <text x="1365" y="772" class="moduleSmall">context · AI chats</text>
  </g>

  <!-- User-scoped calendar -->
  <g filter="url(#shadow)">
    <rect x="80" y="625" width="300" height="166" rx="18" fill="#182233" stroke="#52647e"/>
    <circle cx="120" cy="671" r="18" fill="#3b4a61"/>
    <path d="M112 664h16v15h-16zM115 660v6M125 660v6M115 673h10" fill="none" stroke="#d3def0" stroke-width="2" stroke-linecap="round"/>
    <text x="110" y="724" class="moduleLabel">Calendar personale</text>
    <text x="110" y="750" class="moduleSmall">userId · eventi locali</text>
    <text x="110" y="772" class="moduleSmall">Google · Outlook sync</text>
  </g>
  <path d="M560 517 V560 H230 V625" class="lineBlue"/>
  <text x="270" y="548" class="small">contesto utente</text>

  <!-- Legend -->
  <rect x="80" y="855" width="1465" height="70" rx="16" fill="#0b1422" stroke="#26364e"/>
  <circle cx="115" cy="890" r="6" fill="#6ca9ff"/>
  <text x="132" y="896" class="small">relazione accesso / contesto utente</text>
  <circle cx="430" cy="890" r="6" fill="#58d8b0"/>
  <text x="447" y="896" class="small">gerarchia workspace → project → moduli</text>
  <text x="910" y="896" class="small">Project = isolamento operativo principale</text>
</svg>
